---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "cron", cronjob: "0 0 * * *", timezone: "Asia/Shanghai" }
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message: { prefix: "chore", include: "scope" }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: "docker"
    directory: "/bserver"
    schedule: { interval: "cron", cronjob: "0 0 * * *", timezone: "Asia/Shanghai" }
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message: { prefix: "chore", include: "scope" }
    groups: { docker: { patterns: ["*"] } }

  # python
  - package-ecosystem: "docker"
    directory: "/bi/base"
    schedule: { interval: "cron", cronjob: "0 0 * * *", timezone: "Asia/Shanghai" }
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message: { prefix: "chore", include: "scope" }
    ignore:
      - dependency-name: python
        versions: [">= 3.10.0"]
    groups: { docker: { patterns: ["*"] } }
